name: User story
description: Funcionalidad nueva desde el punto de vista del usuario
type: Feature
body:
  - type: textarea
    id: story
    attributes:
      label: Historia
      placeholder: Como <rol>, quiero <acción> para <beneficio>.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      value: |
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options: [Alta, Media, Baja]
  - type: dropdown
    id: estimate
    attributes:
      label: Estimación
      options: ["1", "2", "3", "5", "8", "13"]
