name: Bug
description: Algo no funciona como debería
type: Bug
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / capturas
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options: [Alta, Media, Baja]
