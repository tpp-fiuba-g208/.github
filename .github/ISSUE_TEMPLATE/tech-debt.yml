name: Tech debt
description: Código o infraestructura que hay que mejorar
type: Task
labels: [tech-debt]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué hay que mejorar
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Por qué / impacto
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options: [Alta, Media, Baja]
